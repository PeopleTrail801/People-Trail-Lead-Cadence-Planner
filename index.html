<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lead Cadence Planner</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#f5f6f8;--panel:#fff;--ink:#17212b;--muted:#5f6c7a;--line:#e2e6eb;--chip:#eef1f4;
  --brand:#0f4c5c;--brand2:#e36414;--brand-ink:#fff;
  --good:#17784a;--good-bg:#e2f3e9;--warn:#8a5a00;--warn-bg:#fff2d1;--bad:#b42318;--bad-bg:#fde7e5;
  --ET:#2563eb;--CT:#7c3aed;--MT:#0f766e;--AZ:#c2410c;--PT:#be185d;--AK:#475569;--HI:#475569;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0e1318;--panel:#161d25;--ink:#e5eaef;--muted:#9aa6b2;--line:#29323c;--chip:#212a34;
  --brand:#3b9bb0;--good:#5fd39a;--good-bg:#15302a;--warn:#f1c24d;--warn-bg:#382d0f;--bad:#ff8a80;--bad-bg:#3c1a18;
  --shadow:none;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--brand)}
header{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line)}
.bar{max-width:1240px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.logo{font-weight:700;font-size:16px;margin-right:8px;white-space:nowrap}
.logo span{color:var(--brand2)}
nav{display:flex;gap:2px;flex-wrap:wrap}
nav button{background:none;border:0;padding:8px 11px;border-radius:8px;color:var(--muted);font:inherit;font-weight:600;cursor:pointer}
nav button.on{background:var(--chip);color:var(--ink)}
.spacer{flex:1}
main{max-width:1240px;margin:0 auto;padding:16px}
h2{font-size:15px;margin:22px 0 8px;display:flex;align-items:center;gap:8px}
h2 .count{background:var(--chip);border-radius:10px;padding:1px 8px;font-size:12px;color:var(--muted)}
h3{font-size:14px;margin:16px 0 6px}
.muted{color:var(--muted)} .small{font-size:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:var(--shadow)}
.grid{display:grid;gap:12px}
.stats{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.stat b{font-size:22px;display:block}
.stat > .small{display:block;margin-top:2px}
:root{--prime:#b7860b;--prime-bg:#fdf1c7;--prime-ink:#6b4e00;--rfp:#17784a;--rfp-bg:#dff3e7;--rfp-ink:#11603a;--small:#2563eb;--small-bg:#e3ecff;--small-ink:#1d4ed8}
@media (prefers-color-scheme:dark){:root{--prime:#e0b23a;--prime-bg:#3a2f0e;--prime-ink:#f3d27a;--rfp:#4fc58a;--rfp-bg:#123326;--rfp-ink:#7fdcab;--small:#6b9bff;--small-bg:#16244a;--small-ink:#a9c3ff}}
.band{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;border:1px solid;white-space:nowrap;vertical-align:1px}
.band-prime{background:var(--prime-bg);color:var(--prime-ink);border-color:var(--prime)}
.band-rfp{background:var(--rfp-bg);color:var(--rfp-ink);border-color:var(--rfp)}
.band-small{background:var(--small-bg);color:var(--small-ink);border-color:var(--small)}
.task.band-prime-row{border-left:5px solid var(--prime)} .task.band-rfp-row{border-left:5px solid var(--rfp)} .task.band-small-row{border-left:5px solid var(--small)}
tr.band-prime-row td:first-child{box-shadow:inset 5px 0 var(--prime)} tr.band-rfp-row td:first-child{box-shadow:inset 5px 0 var(--rfp)} tr.band-small-row td:first-child{box-shadow:inset 5px 0 var(--small)}
.li-state{font-size:11px}
.stat.over b{color:var(--bad)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 12px;border-radius:8px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.good{border-color:var(--good);color:var(--good)} .btn.bad{border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
select,input[type=text],input[type=number],input[type=date],input[type=time],input[type=search],textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 8px;max-width:100%}
textarea{width:100%;min-height:140px}
label.chk{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.zone{display:inline-block;font-size:11px;font-weight:700;color:#fff;border-radius:5px;padding:1px 6px;letter-spacing:.3px}
.win{display:inline-block;font-size:11px;font-weight:700;border-radius:5px;padding:1px 6px}
.win.best,.zt.best{background:var(--good-bg);color:var(--good)} .win.ok,.zt.ok{background:var(--chip);color:var(--muted)}
.win.wait{background:var(--warn-bg);color:var(--warn)} .win.late,.win.unk,.zt.poor{background:var(--bad-bg);color:var(--bad)}
.zt{display:inline-block;font-size:11px;font-weight:600;border-radius:5px;padding:1px 5px;margin:1px 2px 1px 0;white-space:nowrap}
.zt.plain{background:var(--chip);color:var(--muted)}
.opt{display:inline-block;min-width:22px;text-align:center;font-weight:700;border-radius:5px;padding:0 6px;font-size:12px}
.opt0{background:var(--chip);color:var(--muted)} .opt1{background:var(--warn-bg);color:var(--warn)}
.opt2{background:#dbeafe;color:#1e40af} .opt3{background:var(--good-bg);color:var(--good)}
@media (prefers-color-scheme:dark){.opt2{background:#1e2c4a;color:#93b4ff}}
.tag{display:inline-block;font-size:11px;border-radius:5px;padding:1px 6px;background:var(--chip);color:var(--muted);font-weight:600}
.tag.bad{background:var(--bad-bg);color:var(--bad)} .tag.warn{background:var(--warn-bg);color:var(--warn)} .tag.good{background:var(--good-bg);color:var(--good)}
.task{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;display:grid;grid-template-columns:minmax(220px,1.3fr) minmax(170px,1fr) minmax(200px,1.2fr);gap:8px 16px;align-items:start}
.task .full{grid-column:1/-1}
.name{font-weight:700;cursor:pointer}
.name:hover{text-decoration:underline}
.outs{display:flex;flex-wrap:wrap;gap:6px}
details.script{border-top:1px dashed var(--line);padding-top:6px}
details.script summary,details.more summary{cursor:pointer;color:var(--brand);font-weight:600;font-size:13px}
.say{white-space:pre-wrap;background:var(--bg);border-radius:8px;padding:10px;margin:6px 0}
.say mark{background:var(--warn-bg);color:var(--warn);border-radius:3px;padding:0 2px}
.empty{padding:16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chipbtn{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:3px 10px;font:inherit;font-size:12px;cursor:pointer;color:var(--muted)}
.chipbtn.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
table{border-collapse:collapse;width:100%}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:700;position:sticky;top:0;background:var(--panel);white-space:nowrap}
tr.row:hover td{background:var(--bg);cursor:pointer}
tr.blk td{background:var(--panel)}
tr.blk.passive td{color:var(--muted);background:var(--bg)}
.bulk{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0;padding:8px 10px;border-radius:10px;background:var(--chip)}
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(600px,100%);background:var(--panel);z-index:41;overflow:auto;padding:18px;border-left:1px solid var(--line)}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 12px}
.fields label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);font-weight:600}
.fields input,.fields select{width:100%}
.fields label.chk{flex-direction:row;align-items:center;justify-content:flex-start;align-self:end;padding:8px 0;color:var(--ink)}
.fields label.chk input{width:auto}
.hist{font-size:13px}
.hist div{padding:4px 0;border-bottom:1px solid var(--line)}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 12px;margin-bottom:12px;font-weight:600}
.drop{border:2px dashed var(--line);border-radius:12px;padding:22px;text-align:center}
.zonestrip{display:flex;gap:14px;flex-wrap:wrap;font-size:13px}
.daystrip{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.daybtn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 10px;min-width:118px;text-align:left;cursor:pointer;font:inherit;color:var(--ink)}
.daybtn.on{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand) inset}
.daybtn b{display:block;font-size:13px}
.daybtn .small{display:block}
.daybtn.over{border-color:var(--bad)}
.edit td input,.edit td select{width:100%}
.edit td{padding:5px 6px}
.mini{width:70px}
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(540px,94vw);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;z-index:51;padding:18px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:9px 16px;border-radius:10px;z-index:60;font-weight:600;max-width:90vw}
@media (max-width:760px){.task{grid-template-columns:1fr}.fields{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="bar">
  <div class="logo">Lead <span>Cadence</span></div>
  <nav id="tabs"></nav>
  <div class="spacer"></div>
  <label class="small muted">Working as
    <select id="repSel"></select></label>
  <span id="backup" class="small"></span>
  <button class="btn sm primary" data-act="export">Download tracker</button>
</div></header>
<main id="app"></main>
<div id="drawerHost"></div>
<div id="modalHost"></div>

<script>
'use strict';
/* ============================================================
   Lead Cadence Planner
   All lead data stays in this browser (IndexedDB), optionally auto-saved to an
   Excel file on this computer. Nothing is sent to any server.
   ============================================================ */

const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
function toast(msg){ document.querySelectorAll('.toast').forEach(x=>x.remove()); const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),3000); }

/* ---------------- Time zones ---------------- */
const ZONES = {
  ET:{label:'Eastern',  iana:'America/New_York',   order:0},
  CT:{label:'Central',  iana:'America/Chicago',    order:1},
  MT:{label:'Mountain', iana:'America/Denver',     order:2},
  AZ:{label:'Arizona',  iana:'America/Phoenix',    order:3},
  PT:{label:'Pacific',  iana:'America/Los_Angeles',order:4},
  AK:{label:'Alaska',   iana:'America/Anchorage',  order:5},
  HI:{label:'Hawaii',   iana:'Pacific/Honolulu',   order:6},
};
const AC_LIST = {
  ET:'203 475 860 959 302 202 771 239 305 321 352 386 407 448 561 645 656 689 727 728 754 772 786 813 850 863 904 941 954 229 404 470 478 678 706 762 770 912 943 260 317 463 574 765 812 930 502 606 859 207 227 240 301 410 443 667 339 351 413 508 617 774 781 857 978 231 248 269 313 517 586 616 679 734 810 906 947 989 603 201 551 609 640 732 848 856 862 908 973 212 315 332 347 363 516 518 585 607 624 631 646 680 716 718 838 845 914 917 929 934 252 336 472 704 743 828 910 919 980 984 216 220 234 283 326 330 380 419 436 440 513 567 614 740 937 215 223 267 272 412 445 484 570 582 610 717 724 814 835 878 401 803 839 843 854 864 423 865 802 276 434 540 571 686 703 757 804 826 948 304 681',
  CT:'205 251 256 334 659 938 327 479 501 870 217 224 309 312 331 447 464 618 630 708 730 773 779 815 847 861 872 219 319 515 563 641 712 316 620 785 913 270 364 225 318 337 504 985 218 320 507 612 651 763 952 228 601 662 769 314 417 557 573 636 660 816 975 308 402 531 701 405 539 572 580 918 605 615 629 731 901 931 210 214 254 281 325 346 361 409 430 432 469 512 682 713 726 737 806 817 830 832 903 936 940 945 956 972 979 262 274 414 534 608 715 920',
  MT:'303 719 720 970 983 208 986 406 505 575 915 385 435 801 307',
  AZ:'480 520 602 623 928',
  PT:'209 213 279 310 323 341 350 369 408 415 424 442 510 530 559 562 619 626 628 650 657 661 669 707 714 747 760 805 818 820 831 840 858 909 916 925 949 951 702 725 775 458 503 541 971 206 253 360 425 509 564',
  AK:'907', HI:'808'
};
const AREA = {}; for (const [z,s] of Object.entries(AC_LIST)) s.split(/\s+/).forEach(a => AREA[a] = z);
const STATE_ZONE = {};
'CT DE DC FL GA IN KY ME MD MA MI NH NJ NY NC OH PA RI SC VT VA WV'.split(' ').forEach(s=>STATE_ZONE[s]='ET');
'AL AR IL IA KS LA MN MS MO NE ND OK SD TN TX WI'.split(' ').forEach(s=>STATE_ZONE[s]='CT');
'CO ID MT NM UT WY'.split(' ').forEach(s=>STATE_ZONE[s]='MT');
Object.assign(STATE_ZONE,{AZ:'AZ',CA:'PT',NV:'PT',OR:'PT',WA:'PT',AK:'AK',HI:'HI'});
const STATE_NAMES = {alabama:'AL',alaska:'AK',arizona:'AZ',arkansas:'AR',california:'CA',colorado:'CO',connecticut:'CT',delaware:'DE','district of columbia':'DC',florida:'FL',georgia:'GA',hawaii:'HI',idaho:'ID',illinois:'IL',indiana:'IN',iowa:'IA',kansas:'KS',kentucky:'KY',louisiana:'LA',maine:'ME',maryland:'MD',massachusetts:'MA',michigan:'MI',minnesota:'MN',mississippi:'MS',missouri:'MO',montana:'MT',nebraska:'NE',nevada:'NV','new hampshire':'NH','new jersey':'NJ','new mexico':'NM','new york':'NY','north carolina':'NC','north dakota':'ND',ohio:'OH',oklahoma:'OK',oregon:'OR',pennsylvania:'PA','rhode island':'RI','south carolina':'SC','south dakota':'SD',tennessee:'TN',texas:'TX',utah:'UT',vermont:'VT',virginia:'VA',washington:'WA','west virginia':'WV',wisconsin:'WI',wyoming:'WY'};
function normState(s){ const t=String(s||'').trim(); if(!t) return ''; if(/^[A-Za-z]{2}$/.test(t)) return t.toUpperCase(); return STATE_NAMES[t.toLowerCase()] || ''; }
function areaCode(p){ let d=String(p||'').replace(/\D/g,''); if(d.length===11 && d[0]==='1') d=d.slice(1); return d.length>=10 ? d.slice(0,3) : ''; }
function zoneInfo(c){
  if (c.tzOverride) return {zone:c.tzOverride, src:'set manually'};
  for (const [k,lab] of [['directPhone','direct phone'],['businessPhone','business phone']]){
    const a = areaCode(c[k]); if (a && AREA[a]) return {zone:AREA[a], src:`${lab} area code ${a}`};
  }
  const st = normState(company(c).state);
  if (st && STATE_ZONE[st]) return {zone:STATE_ZONE[st], src:`company state (${st})`};
  return {zone:'', src:'unknown'};
}
const fmtCache = {};
function hourIn(iana, d=new Date()){
  const f = fmtCache[iana] || (fmtCache[iana] = new Intl.DateTimeFormat('en-US',{timeZone:iana,hour:'numeric',minute:'2-digit',hourCycle:'h23'}));
  const p = f.formatToParts(d); return (+p.find(x=>x.type==='hour').value % 24) + (+p.find(x=>x.type==='minute').value)/60;
}
const REP_TZ = Intl.DateTimeFormat().resolvedOptions().timeZone;
function clockIn(iana){ return new Intl.DateTimeFormat('en-US',{timeZone:iana,hour:'numeric',minute:'2-digit'}).format(new Date()); }
function fmtHour(h){ h=((h%24)+24)%24; let hh=Math.floor(h), mm=Math.round((h-hh)*60); if (mm===60){hh=(hh+1)%24;mm=0;} const ap=hh<12?'am':'pm'; const h12=hh%12||12; return mm? `${h12}:${String(mm).padStart(2,'0')}${ap}` : `${h12}${ap}`; }
/* Hours between the prospect's zone and yours. Pass a date (YYYY-MM-DD) for future days: Arizona and Hawaii
   don't change clocks, so their gap to you shifts when daylight saving starts or ends. */
function zoneDiff(zone, D){ const at = D ? (()=>{ const x=parseYmd(D); x.setHours(12); return x; })() : new Date();
  let d = hourIn(ZONES[zone].iana, at) - hourIn(REP_TZ, at); if (d>12) d-=24; if (d<-12) d+=24; return Math.round(d*2)/2; }
const REP_ZONE = (()=>{ for (const k of ['MT','CT','ET','PT','AZ','AK','HI']) if (zoneDiff(k)===0) return k; return 'your time'; })();
const hrs = t => { const m=String(t||'').match(/^(\d{1,2}):(\d{2})/); return m ? +m[1] + +m[2]/60 : 0; };
const fmtRange = (a,b) => `${fmtHour(hrs(a))}–${fmtHour(hrs(b))}`;

/* Best windows (prospect local time), editable in Settings */
function parseWins(str){
  const out=[];
  for (const part of String(str||'').split(',')){
    const m = part.split(/[-–]/); if (m.length!==2) continue;
    const p = s => { const x=s.trim().toLowerCase().match(/^(\d{1,2})(?:[:.](\d{1,2}))?\s*(am|pm)?$/); if(!x) return NaN; let h=+x[1]; const mi=x[2]? (x[2].length===1? +x[2]*6 : +x[2]) : 0; if (x[3]==='pm' && h<12) h+=12; if (x[3]==='am' && h===12) h=0; return h+mi/60; };
    const a=p(m[0]), b=p(m[1]); if (!isNaN(a) && !isNaN(b) && b>a) out.push([a,b]);
  }
  return out;
}
let W = {};
function buildWindows(){ const w=DB.settings.windows; W={}; for (const ch of ['call','email','linkedin']) W[ch]={best:parseWins(w[ch]), ok:parseWins(w[ch+'Ok'])}; }
const inWin = (h, wins) => wins.some(([a,b]) => h>=a && h<b);
function windowStatus(zone, c){
  if (!zone) return {key:'unk', rank:4, label:'Zone unknown'};
  const h = hourIn(ZONES[zone].iana), cw=callWinsFor(c), bt=c?bestTime(c):{days:[]};
  if (bt.days.length && !bt.days.includes(DAYS3[new Date().getDay()])) return {key:'wait', rank:2, label:`Prefers ${bt.days.map(d=>d[0].toUpperCase()+d.slice(1)).join('/')}`};
  if (inWin(h, cw.best)) return {key:'best', rank:0, label: cw.own ? 'Their preferred time now' : 'Best window now'};
  if (cw.own){ const nx=cw.best.map(x=>x[0]).filter(x=>x>h).sort((a,b)=>a-b)[0]; return {key:'wait', rank:2, label: nx!=null ? `Preferred time starts ${fmtHour(nx)} there` : 'Past their preferred time'}; }
  if (inWin(h, cw.ok)) return {key:'ok', rank:1, label:'Callable'};
  const first = Math.min(...cw.best.map(x=>x[0]), 8);
  if (h<first) return {key:'wait', rank:2, label:'Too early there'};
  if (h>=12 && h<13) return {key:'wait', rank:2, label:'Their lunch hour'};
  return {key:'late', rank:3, label:'After hours there'};
}
function windowHint(zone, c){ if(!zone) return ''; const d=zoneDiff(zone); const b=callWinsFor(c).best[0]; if (!b) return ''; if (d===0) return 'Same time zone as you'; return `Their ${fmtHour(b[0])}–${fmtHour(b[1])} = your ${fmtHour(b[0]-d)}–${fmtHour(b[1]-d)}`; }
function zoneBadge(zone){ return zone ? `<span class="zone" style="background:var(--${zone})">${zone}</span>` : `<span class="zone" style="background:#888">??</span>`; }

/* ---------------- Dates ---------------- */
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const todayStr = () => ymd(new Date());
const parseYmd = s => { const [y,m,d]=String(s).split('-').map(Number); return new Date(y,(m||1)-1,d||1); };
const addDays = (s,n) => { const d=parseYmd(s); d.setDate(d.getDate()+n); return ymd(d); };
const nextBiz = s => { const d=parseYmd(s); while(d.getDay()===0||d.getDay()===6) d.setDate(d.getDate()+1); return ymd(d); };
const daysBetween = (a,b) => Math.round((parseYmd(b)-parseYmd(a))/864e5);
const prettyDate = s => s ? parseYmd(s).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}) : '';
const isValidYmd = s => /^\d{4}-\d{2}-\d{2}$/.test(String(s||''));
function toYmd(v){ const s=String(v||'').trim(); if (!s) return ''; if (isValidYmd(s)) return s; const d=new Date(s); return isNaN(d) ? '' : ymd(d); }

/* ---------------- Playbook content (defaults; edits are layered on top) ---------------- */
const PERSONAS = {

  OPS: {label:'HR operations / compliance',     d1:'D', vm1:'VM2', d5:'E', vm5:'VM5', em1:'e1'},

function personaFromTitle(t){
  t = String(t||'').toLowerCase();
  if (/chief (people|human)|chro|\bvp\b|vice president|\bdirector\b|head of|\bsvp\b|\bevp\b/.test(t) && /(hr|human|people|talent|personnel|workforce)/.test(t)) return /talent|recruit/.test(t) ? 'TA' : 'HRL';
  if (/talent|recruit|staffing|acquisition|sourcing/.test(t)) return 'TA';
  if (/\b(owner|ceo|coo|cfo|president|founder|principal)\b|chief (executive|operating|financial)/.test(t)) return 'EXEC';
  if (/\bvp\b|vice president|\bdirector\b|head of/.test(t)) return 'HRL';
  return 'OPS';
}

function emailSuggestions(c){

function returnDateIn(text){
  const s=String(text||'').toLowerCase(), t=todayStr(), hits=[];
  for (const x of s.matchAll(/\b(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/g)){ const d=futureDate(+x[1], +x[2], x[3]?+x[3]:0); if (d) hits.push(d); }
  for (const x of s.matchAll(/\b(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?\s+(\d{1,2})(?:st|nd|rd|th)?(?:,?\s+(\d{4}))?/g)){ const d=futureDate(MONTHS.indexOf(x[1])+1, +x[2], x[3]?+x[3]:0); if (d) hits.push(d); }
  for (const x of s.matchAll(/\b(\d{1,2})(?:st|nd|rd|th)?\s+(?:of\s+)?(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*/g)){ const d=futureDate(MONTHS.indexOf(x[2])+1, +x[1], 0); if (d) hits.push(d); }
  if (!hits.length){ const w=s.match(/\b(?:back|return(?:ing)?)\b[^.]{0,30}?\b(monday|tuesday|wednesday|thursday|friday)\b/); if (w){ const want=['sunday','monday','tuesday','wednesday','thursday','friday','saturday'].indexOf(w[1]); let d=addDays(t,1); while (parseYmd(d).getDay()!==want) d=addDays(d,1); hits.push(d); } }
  const future=hits.filter(d=>d>t).sort(); return future.length ? future[future.length-1] : '';  /* the last date mentioned is usually the return */
}
function detectReply(text){
  const s=String(text||'').toLowerCase();
  if (/undeliverable|delivery (status notification|has failed|failed)|mail delivery (failed|subsystem)|mailer-daemon|address not found|user unknown|no such user|5\.\d\.\d|\b550\b/.test(s)) return {type:'bounce'};
  if (/no longer (with|employed|work)|has left|left the (company|organization|firm)|not with .{0,30} anymore|is no longer/.test(s)) return {type:'left'};
  if (/out of (the )?office|automatic reply|auto[- ]?reply|autoreply|on (vacation|holiday|leave|pto)|annual leave|away from (the office|my desk)|limited access to (e-?mail|my email)|\booo\b|returning on|i will be back|back in the office|currently away/.test(s)) return {type:'ooo', back:returnDateIn(s)};
  if (/unsubscribe|remove me|take me off|stop (emailing|contacting)|do not (contact|email)|opt(ed)? out/.test(s)) return {type:'optout'};
  if (/not (the right|the best) person|you('d| would) (want|need) to (talk|speak|reach)|better (person|contact)|reach out to|contact .{0,40} instead|handles (that|this|our)|cc'?ing|looping in/.test(s)) return {type:'referral'};
  if (/not interested|no interest|we('re| are) (all )?set|happy with (our|the) (current|provider)|no thanks|no, thank|not a fit/.test(s)) return {type:'notint'};
  if (/not (right )?now|maybe later|next (quarter|year)|reach (back )?out (in|after)|check back|circle back|after (our|the) renewal|bad time/.test(s)) return {type:'notnow'};
  if (/calendar invite|booked|let's meet|scheduled|see you (on|then)/.test(s)) return {type:'meeting'};

}

function applyReply(c, type, o){

    if (t) t.autoReply=`Out of office${back?' until '+prettyDate(back):''}`;
    if (back && c.status==='Attempting'){ const nxt=nextStep(c); const shift = nxt ? daysBetween(nxt.due<today?today:nxt.due, back) : 0;
      if (shift>0){ c.startDate=addDays(c.startDate, shift); for (const r of pendingRecalls(c)) if (r.date<back){ r.date=back; } msg=`Out of office until ${prettyDate(back)}: their next touches move ${shift} day${shift===1?'':'s'} later.`; }
      else msg=`Out of office until ${prettyDate(back)}: their next touch is already after that.`; }

}

function findContacts(q){

  let hits = found.size ? DB.contacts.filter(x=>x.email && found.has(x.email)) : [];
  if (!hits.length){ const ql=q.toLowerCase(); hits = DB.contacts.filter(x=>x.name && (ql.includes(x.name.toLowerCase()) || (!found.size && `${x.name} ${x.email}`.toLowerCase().includes(ql)))); }
  return hits.sort((a,b)=>(mine(b)?1:0)-(mine(a)?1:0));

function queueModel(){

  for (const c of DB.contacts) if (c.status==='Attempting') active[c.companyKey]=(active[c.companyKey]||0)+1;
  const waiting = DB.contacts.filter(c=>c.status==='New' && (cur==='all'||c.owner===cur)).sort((a,b)=>priority(b)-priority(a));
  const ready = waiting.filter(c=>(active[c.companyKey]||0) < max);

}
function startTop(n){

function touchesPerContact(){ const n={call:0,email:0,linkedin:0}; for (const s of TRACKS.cold) n[s.ch]=(n[s.ch]||0)+1; return n; }
/* Expected touches per started contact, allowing for people who answer and leave the cadence. */
function expectedPerContact(){

  for (const s of [...TRACKS.cold].sort((a,b)=>a.day-b.day)){ if (s.ch==='call'){ call+=alive; alive*=1-p; } else if (s.ch==='email'){ email+=alive; alive*=0.99; } else li+=alive; }

function recommend(dueCounts){

function bizDays(n){ const out=[]; let d=nextBiz(todayStr()); while(out.length<n){ out.push(d); d=nextBiz(addDays(d,1)); } return out; }
function plannedStarts(days, perDay){

  if (cur==='all' || !(perDay>0)) return virt;
  const {active, waiting, max} = queueModel(); const act={...active}, pool=waiting.slice(), t=todayStr();
  const startedToday = DB.contacts.filter(c=>mine(c) && c.startDate===t && c.status!=='New').length;
  for (const d of days){
    let room = d===t ? Math.max(0, perDay-startedToday) : perDay;
    for (let j=0; j<pool.length && room>0;){ const c=pool[j]; if ((act[c.companyKey]||0) >= max){ j++; continue; } virt.set(c.id, d); act[c.companyKey]=(act[c.companyKey]||0)+1; pool.splice(j,1); room--; }
  }
  return virt;
}
function dayItems(D, virt, first){
  const items=[];
  for (const c of DB.contacts){
    if (!mine(c)) continue;
    if (c.status==='Attempting'){
      if (first){ for (const it of dueByChannel(c, D)) items.push({...it, planned:false}); }
      else { const seen={}; for (const s of pendingSteps(c)){ if (dueDate(c,s)!==D || seen[s.ch]) continue; seen[s.ch]=1; items.push({c, step:s, due:D, behind:0, planned:false}); } }
    } else if (virt.has(c.id)){
      const vs=virt.get(c.id);
      for (const s of (TRACKS[trackFor(c)]||[])) if (dueFrom(vs,s)===D) items.push({c, step:s, due:D, behind:0, planned:true, start:vs});
    }
  }
  return items;
}
function blockFit(b, zone, ch, D, c){
  if (!zone) return 0.5; const w = ch==='call' && c ? callWinsFor(c) : W[ch]; if (!w) return 0.5;
  const d=zoneDiff(zone, D), s=hrs(b.start)+d, e=hrs(b.end)+d; let best=0, ok=0, n=0;
  for (let t=s; t<e-1e-9; t+=1/12){ n++; if (inWin(t, w.best)) best++; else if (inWin(t, w.ok)) ok++; }

}
const fitClass = f => f>=0.75 ? 'best' : f>=0.4 ? 'ok' : 'poor';
function planDay(D, virt, first){

  const over=[], rate=DB.settings.rates;

    const type = ch==='call' ? 'calls' : ch;
    const bl = blocks.filter(b=>b.type===type);
    for (const b of bl) b.cap = Math.max(1, Math.round(Math.max(0, hrs(b.end)-hrs(b.start)) * (rate[ch]||30)));
    const its = items.filter(x=>x.step.ch===ch).sort((a,b)=>priority(b.c)-priority(a.c));
    for (const it of its){

      it.on = D;
      const ranked = bl.map(b=>({b, f:blockFit(b, it.zone, ch, D, it.c)})).sort((x,y)=> y.f-x.f || hrs(x.b.start)-hrs(y.b.start));

    }
  }
  for (const b of blocks) b.items.sort((a,b2)=>(ZONES[a.zone]?.order??9)-(ZONES[b2.zone]?.order??9) || priority(b2.c)-priority(a.c));

const norm = s => String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'');

function parseReportPaste(text){
  const lines = text.split(/\r?\n/).map(s=>s.replace(/ /g,' ').trim()).filter(Boolean);
  const HEAD = new Set(['#','contact','title','email','direct phone','business phone','linkedin']);
  const recs=[]; let co=null;
  const mkRow = cells => { const [name,title,email,direct,biz,li] = cells.map(blank); if (!name) return;
    const p=name.split(/\s+/);
    recs.push({name, first:p[0], last:p.slice(1).join(' '), title, email:(email||'').toLowerCase(), directPhone:direct, businessPhone:biz,
      linkedin:/linkedin\.com/i.test(li)?li:'', liKnown:!!li, company:co.name, state:co.state, city:'', employees:co.employees, annualHires:co.hires,
      industry:'', lastContacted:'', priorStatus:'', owner:'', notes:''}); };
  for (let i=0;i<lines.length;i++){
    const L=lines[i];
    const m=L.match(/^(.*?)\s*\((.*(employees|annual hires).*)\)\s*$/i);
    if (m){ const parts=m[2].split(/[•·|]/).map(s=>s.trim());
      co={name:m[1].trim(), state:'', employees:'', hires:''};
      for (const p of parts){ if (/employees/i.test(p)) co.employees=num(p); else if (/hires/i.test(p)) co.hires=num(p); else if (!/\d/.test(p)) co.state=p; }
      continue; }
    if (!co) continue;
    if (L.includes('\t')){ const cells=L.split('\t').map(s=>s.trim()); if (/^\d+$/.test(cells[0])) mkRow(cells.slice(1,7)); continue; }
    if (HEAD.has(L.toLowerCase())) continue;
    if (/^\d+$/.test(L) && i+1<lines.length){ const cells=lines.slice(i+1,i+7); while(cells.length<6) cells.push(''); mkRow(cells); i+=6; }
  }
  return recs;
}

function normalizeOutcome(ch, text, done){
  const t=String(text||'').trim().toLowerCase(), d=fromYn(done) || /^(done|sent|✓|✔)$/i.test(String(done||'').trim());
  if (ch==='call' && /call ?back|callback|\bcb\b/.test(t)) return 'Call back requested';
  for (const o of OUTCOMES[ch]) if (t===o.toLowerCase()) return o;
  if (ch==='call'){
    if (!t) return d ? 'No answer' : '';
    if (/book|discovery|meeting|demo/.test(t)) return 'Meeting booked';
    if (/not the right|wrong person|referr/.test(t)) return 'Not the right person';
    if (/wrong|disconnect/.test(t)) return 'Wrong number';
    if (/dnc|do not|don't call|remove/.test(t)) return 'Do not call';
    if (/connect|spoke|talked|conversation|live/.test(t)) return 'Connected';
    if (/\bvm\b|voicemail|voice mail|left/.test(t)) return 'Left voicemail';
    if (/gate|\bgk\b|assistant|reception/.test(t)) return 'Gatekeeper';
    if (/skip/.test(t)) return 'Skip';
    return 'No answer';
  }
  if (ch==='email'){
    if (/book|meeting/.test(t)) return 'Meeting booked'; if (/repl/.test(t)) return 'Replied'; if (/bounce/.test(t)) return 'Bounced';
    if (/opt|unsub|remove/.test(t)) return 'Opted out'; if (/skip/.test(t)) return 'Skip';
    return (t||d) ? 'Sent' : '';
  }
  if (/repl/.test(t)) return 'Replied'; if (/accept/.test(t)) return 'Accepted'; if (/skip/.test(t)) return 'Skip';
  if (/follow.*req|req.*follow|private/.test(t)) return 'Follow requested'; if (/follow/.test(t)) return 'Followed';
  return (t||d) ? 'Done' : '';
}
function importRunSheets(wb){
  const byId=new Map(DB.contacts.map(c=>[c.id,c])); let logged=0, started=0, skipped=0, recalls=0;
  const rowsAll=[];
  for (const name of wb.SheetNames){ if (!/^Day \d+/.test(name)) continue; for (const r of XLSX.utils.sheet_to_json(wb.Sheets[name], {defval:'', raw:false})) rowsAll.push(r); }
  rowsAll.sort((a,b)=> (toYmd(a['Date'])<toYmd(b['Date'])?-1:toYmd(a['Date'])>toYmd(b['Date'])?1:0));
  for (const r of rowsAll){
    const c=byId.get(r['PT_ID']); if (!c) continue;
    const chName=r['Channel'];
    if (chName==='Callback'){ let out=normalizeOutcome('call', r['Outcome'], r['Done?']); if (!out) continue;
      out = ['Connected','Meeting booked','Left voicemail','No answer'].includes(out) ? out : out==='Skip' ? 'Cancel' : 'Connected';
      if (logRecall(c, String(r['Step ID']).replace(/^recall-/,''), out, toYmd(r['Date'])||todayStr(), true)){ logged++; c.touches[c.touches.length-1].sheet=true; } else skipped++; continue; }
    const ch=Object.keys(CH_LABEL).find(k=>CH_LABEL[k]===chName); if (!ch) continue;
    const out=normalizeOutcome(ch, r['Outcome'], r['Done?']); if (!out) continue;
    const date=toYmd(r['Date'])||todayStr();
    if (c.status==='New' && fromYn(r['Planned start?'])){ c.source=c.source||'ZoomInfo'; startCadence(c, toYmd(r['Cadence start'])||date); started++; }
    if (c.status!=='Attempting'){ skipped++; continue; }
    if (applyOutcome(c, r['Step ID'], out, date, true)){ logged++; c.touches[c.touches.length-1].sheet=true; if (out==='Call back requested'){ scheduleRecall(c, nextBiz(addDays(date,1)), theirToRep(c,'10:00',nextBiz(addDays(date,1))), `From run sheet: "${r['Outcome']}". Set the exact time.`, 'them'); recalls++; } } else skipped++;
  }
  save(); return {logged, started, skipped, recalls};
}

function todayModel(){
  const t=todayStr(), calls=[], emails=[], lis=[];
  for (const c of DB.contacts){ if (!mine(c)) continue; for (const it of dueByChannel(c,t)) (it.step.ch==='call'?calls:it.step.ch==='email'?emails:lis).push(it); }
  for (const it of calls){ it.z=zoneInfo(it.c).zone; it.w=windowStatus(it.z, it.c); }
  calls.sort((a,b)=> a.w.rank-b.w.rank || (ZONES[a.z]?.order??9)-(ZONES[b.z]?.order??9) || (a.due<b.due?-1:a.due>b.due?1:0) || priority(b.c)-priority(a.c));
  const byPri=(a,b)=>(a.due<b.due?-1:a.due>b.due?1:0) || priority(b.c)-priority(a.c);
  emails.sort(byPri); lis.sort(byPri);
  const revisits = DB.contacts.filter(c=>mine(c) && c.status==='Nurture' && c.revisitDate && c.revisitDate<=t && c.source!=='Closed lost');
  const lostDue = DB.contacts.filter(c=>mine(c) && c.status==='Nurture' && c.source==='Closed lost' && c.revisitDate && c.revisitDate<=t).sort((a,b)=>a.revisitDate.localeCompare(b.revisitDate) || priority(b)-priority(a));
  const lostSoon = DB.contacts.filter(c=>mine(c) && c.status==='Nurture' && c.source==='Closed lost' && c.revisitDate>t && c.revisitDate<=addDays(t,14)).length;
  const connected = DB.contacts.filter(c=>mine(c) && c.status==='Connected');
  const doneToday = DB.contacts.filter(mine).reduce((n,c)=>n+allTouches(c).filter(x=>x.date===t && x.outcome!=='Skip').length,0);
  const recalls = recallsOn(t, true);
  const needEmail = DB.contacts.filter(c=>mine(c) && c.emailBad && !['Do not contact','Unqualified','Discovery booked'].includes(c.status));
  return {t, calls, emails, lis, revisits, lostDue, lostSoon, connected, doneToday, recalls, needEmail, renewals:renewalsDue(t)};
}
/* Playbook slide 14 / Sequence F: known renewal date → re-engage 90 days before it.
   Lists companies renewing in the next 90 days where nobody is being worked right now. */
function renewalsDue(t){
  const out=[], by={};
  for (const c of DB.contacts) (by[c.companyKey] ||= []).push(c);
  for (const [key, list] of Object.entries(by)){
    const co=DB.companies[key]; if (!co || !isValidYmd(co.renewalDate)) continue;
    const days=daysBetween(t, co.renewalDate); if (days<0 || days>90 || co.renewalDismissed===co.renewalDate) continue;
    if (list.some(c=>['Attempting','Connected','Discovery booked'].includes(c.status))) continue;
    const ready=list.filter(c=>mine(c) && ['New','Nurture','Paused'].includes(c.status)).sort((a,b)=>priority(b)-priority(a));
    if (ready.length) out.push({co, days, ready});
  }
  return out.sort((a,b)=>a.days-b.days);
}

/* ---------- Leads tab ---------- */
function filteredContacts(){
  const f=UI.f, q=f.q.trim().toLowerCase(), cur=DB.settings.currentRep;
  let list = DB.contacts.filter(c=>{
    if (f.owner==='mine' && cur!=='all' && c.owner!==cur) return false;
    if (f.owner!=='mine' && f.owner!=='any' && c.owner!==f.owner) return false;
    const co=company(c);
    if (q && !`${c.name} ${c.title} ${c.email} ${co.name}`.toLowerCase().includes(q)) return false;
    if (f.zones.size){ const z=zoneInfo(c).zone||'??'; if (!f.zones.has(z)) return false; }
    if (f.status && c.status!==f.status) return false;
    if (f.minOpt && optimal(co)<f.minOpt) return false;
    if (f.persona && persona(c)!==f.persona) return false;
    if (f.band && (acctSize(company(c)).band||'none')!==f.band) return false;
    if (f.source==='both' ? !c.alsoOn : (f.source && c.source!==f.source)) return false;
    if (f.state && normState(co.state)!==f.state) return false;
    return true;
  });
  const cmp = { priority:(a,b)=>priority(b)-priority(a), company:(a,b)=>company(a).name.localeCompare(company(b).name)||priority(b)-priority(a),
    zone:(a,b)=>(ZONES[zoneInfo(a).zone]?.order??9)-(ZONES[zoneInfo(b).zone]?.order??9)||priority(b)-priority(a),
    next:(a,b)=>{ const x=nextStep(a)?.due||'9999', y=nextStep(b)?.due||'9999'; return x<y?-1:x>y?1:0; }, status:(a,b)=>STATUSES.indexOf(a.status)-STATUSES.indexOf(b.status) }[UI.sort];
  return list.sort(cmp);
}

  </div><div class="filters"><span class="small muted">Time zone:</span><div class="chips">${zchips}</div><span class="small muted">${list.length} contact${list.length===1?'':'s'}${list.length>shown.length?` (showing first ${shown.length})`:''}</span></div>`;

    <select id="bulkStatus"><option value="">Set status…</option>${STATUSES.filter(x=>x!=='Attempting').map(x=>`<option>${x}</option>`).join('')}</select>
    <select id="bulkLost"><option value="">Mark closed-lost: reason…</option>${Object.entries(LOSS_CATS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select>

    <button class="btn sm bad" data-act="bulkDelete">Delete</button>
    <button class="btn sm" data-act="clearSel">Clear</button></div>`;
  if (!list.length) return h + `<div class="empty">No contacts match these filters.</div>`;
  const allSel = shown.every(c=>sel.has(c.id));
  h += `<div class="tablewrap"><table><thead><tr><th><input type="checkbox" data-act="selAll" ${allSel?'checked':''}></th><th>Contact</th><th>Company</th><th>Opt</th><th>Zone · their time</th><th>Persona</th><th>Status</th><th>Next touch</th><th>Owner</th></tr></thead><tbody>`;

    return `<tr class="row ${bandCls(c)}" data-act="open" data-id="${c.id}"><td data-stop="1"><input type="checkbox" data-act="sel" data-id="${c.id}" ${sel.has(c.id)?'checked':''}></td>

      <td><span class="opt opt${o}">${o}</span></td>
      <td>${zoneBadge(z.zone)} ${z.zone?clockIn(ZONES[z.zone].iana):''}</td>
      <td class="small">${PERSONAS[persona(c)].label}</td>
      <td><span class="tag ${c.status==='Discovery booked'?'good':c.status==='Do not contact'||c.status==='Unqualified'?'bad':c.status==='Paused'?'warn':''}">${esc(c.status)}</span></td>
      <td class="small">${pendingRecalls(c)[0]?`<span class="tag good">Call-back ${prettyDate(pendingRecalls(c)[0].date)} ${fmtHour(hrs(pendingRecalls(c)[0].time))}</span><br>`:''}${c.emailBad?'<span class="tag bad">Email bounced</span><br>':c.emailBlocked||company(c).emailBlocked?'<span class="tag bad">Email blocked</span><br>':''}${n?`${esc(n.step.label)}<br><span class="muted">${prettyDate(n.due)}</span>`:c.revisitDate&&c.status==='Nurture'?`Revisit ${prettyDate(c.revisitDate)}`:'—'}</td>
      <td class="small">${esc(repName(c.owner))}</td></tr>`; }).join('');
  return h + `</tbody></table></div>`;
}

    if (recs.length) h += `<div class="tablewrap"><table><thead><tr><th>Name</th><th>Title</th><th>Company</th><th>Email</th><th>Direct</th><th>Business</th><th>Zone</th></tr></thead><tbody>${recs.slice(0,8).map(r=>{ const a=areaCode(r.directPhone)||areaCode(r.businessPhone); const z=AREA[a]||STATE_ZONE[normState(r.state)]||''; return `<tr><td>${esc(r.name)}</td><td>${esc(r.title)}</td><td>${esc(r.company)}</td><td>${esc(r.email)}</td><td>${esc(r.directPhone)}</td><td>${esc(r.businessPhone)}</td><td>${zoneBadge(z)}</td></tr>`; }).join('')}</tbody></table></div>`;
    h += `<div class="filters" style="margin-top:12px"><label class="small">Assign to ${ownerSel}</label>
      <label class="small">Source <select id="impSource"><option value="auto">Auto (closed lost if it has a loss reason or close date; old lead if it has a last-contacted date or status)</option><option>ZoomInfo</option><option>Old lead</option><option value="Closed lost">Closed lost (HubSpot export)</option></select></label>
      <label class="chk small" title="Off: a lead already in the planner only gets blanks filled in. On: values in this file replace what's there (empty cells never erase anything)."><input type="checkbox" id="impUpdate"> Update existing leads with this file's values</label>
      <button class="btn primary" data-act="commit" ${recs.length?'':'disabled'}>Import ${recs.length} contacts</button><button class="btn" data-act="cancelDraft">Cancel</button></div></div>`;

/* ---------- Cadence tab (editable) ---------- */
function optList(obj, sel, extra=[]){ return extra.map(([v,l])=>`<option value="${v}" ${sel===v?'selected':''}>${esc(l)}</option>`).join('') + Object.entries(obj).map(([k,v])=>`<option value="${k}" ${sel===k?'selected':''}>${esc(k)} · ${esc(v.name||'')}</option>`).join(''); }
function stepVm(st){ return st.vm!==undefined ? st.vm : (st.opener==='persona'||st.opener==='d5') ? 'persona' : ''; }
function renderCadence(){
  const n=touchesPerContact();
  let h = `<div class="card"><b>How editing works</b><p class="small muted" style="margin:6px 0 0">Changes save instantly and apply to everyone already in the cadence. Logged touches stay logged; a step you remove disappears from future days. "Reset" puts back the playbook version. Edits travel with your tracker file, so your teammate can load them.</p></div>`;
  h += `<h2>Persona openers</h2><div class="tablewrap"><table class="edit"><thead><tr><th>Persona</th><th>Call 1 opener</th><th>Call 1 voicemail</th><th>Call 3 opener</th><th>Call 3 voicemail</th><th>Email 1</th></tr></thead><tbody>`;
  for (const [k,p] of Object.entries(PERSONAS)) h += `<tr><td><b>${esc(p.label)}</b></td>${['d1','vm1','d5','vm5','em1'].map(f=>`<td><select data-persona="${k}" data-k="${f}">${optList(f==='em1'?EMAILS:f.startsWith('vm')?VMS:OPENERS, p[f])}</select></td>`).join('')}</tr>`;
  h += `</tbody></table></div><p class="small muted">A company trigger still overrides call 1: new HR leader → opener G; hiring surge or new state → opener H; both with VM4. <button class="btn sm" data-act="resetPersonas">Reset personas</button></p>`;
  for (const [t, steps_] of Object.entries(TRACKS)){
    h += `<h2>${TRACK_LABEL[t]} <span class="count">${steps_.length} touches</span></h2>`;
    if (t==='cold') h += `<p class="small muted" style="margin-top:-4px">Per contact: ${n.call} calls, ${n.email} emails, ${n.linkedin} LinkedIn touches. This sets how many new contacts a day your caps can carry.</p>`;
    h += `<div class="tablewrap"><table class="edit"><thead><tr><th>Day</th><th>Channel</th><th>Label (what you see)</th><th>Script</th><th></th></tr></thead><tbody>`;
    steps_.forEach((st,i)=>{
      let script='';
      if (st.ch==='call') script = `<div style="display:flex;gap:4px"><select data-trk="${t}" data-i="${i}" data-k="opener">${optList(OPENERS, st.opener, [['persona','By persona: call 1 opener'],['d5','By persona: call 3 opener'],['loss','By loss reason (win-back)']])}</select><select data-trk="${t}" data-i="${i}" data-k="vm">${optList(VMS, stepVm(st), [['persona','Voicemail by persona'],['','No voicemail']])}</select></div>`;
      else if (st.ch==='email') script = `<select data-trk="${t}" data-i="${i}" data-k="email">${optList(EMAILS, st.email, [['persona','By persona: email 1'],['loss','By loss reason (win-back)']])}</select>`;
      else script = `<select data-trk="${t}" data-i="${i}" data-k="li">${optList(LINKEDIN, st.li, [['connect','Connection request (auto-picked by trigger)']])}</select>`;
      h += `<tr><td><input class="mini" type="number" min="1" max="120" data-trk="${t}" data-i="${i}" data-k="day" value="${st.day}"></td>
        <td><select data-trk="${t}" data-i="${i}" data-k="ch">${Object.entries(CH_LABEL).map(([k,v])=>`<option value="${k}" ${st.ch===k?'selected':''}>${v}</option>`).join('')}</select></td>
        <td><input type="text" data-trk="${t}" data-i="${i}" data-k="label" value="${esc(st.label)}"></td><td>${script}</td>
        <td><button class="btn sm bad" data-act="delStep" data-trk="${t}" data-i="${i}">Remove</button></td></tr>`;
    });
    h += `</tbody></table></div><div style="margin-top:8px;display:flex;gap:8px"><button class="btn sm" data-act="addStep" data-trk="${t}">Add step</button><button class="btn sm" data-act="resetTrack" data-trk="${t}">Reset to playbook</button></div>`;
  }
  return h;
}

    h += `<h2>${LIB_LABEL[lib]} <button class="btn sm" data-act="addScript" data-lib="${lib}">Add new</button></h2>`;
    for (const [k,v] of Object.entries(LIBS[lib])){
      const edited = DB.custom.scripts[lib]?.[k], isDefault = !!DEFAULTS[lib][k];

          <textarea id="edText">${esc(v.text||'')}</textarea>${lib==='EMAILS'?`<label class="chk small" style="margin-top:6px"><input type="checkbox" id="edThread" ${v.thread?'checked':''}> Send as a reply in the thread of the previous email</label>`:''}
          <div style="margin-top:8px;display:flex;gap:8px"><button class="btn primary sm" data-act="saveScript">Save</button><button class="btn sm" data-act="cancelEdit">Cancel</button></div></div>`;
      } else {
        h += `<div class="card" style="margin-bottom:8px"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><b>${esc(k)}${v.name?' · '+esc(v.name):''}${v.subject?' · Subject: '+esc(v.subject):''}</b>${edited?(isDefault?'<span class="tag warn">Edited</span>':'<span class="tag good">Custom</span>'):''}<div class="spacer"></div>
          <button class="btn sm" data-act="editScript" data-lib="${lib}" data-key="${esc(k)}">Edit</button>${edited&&isDefault?`<button class="btn sm" data-act="resetScript" data-lib="${lib}" data-key="${esc(k)}">Reset</button>`:''}${!isDefault?`<button class="btn sm bad" data-act="deleteScript" data-lib="${lib}" data-key="${esc(k)}">Delete</button>`:''}</div>
          <div class="say">${sayHtml(v.text)}</div></div>`;
      }
    }
  }
  return h;
}

/* ---------- KPIs tab ----------

const RESPONSE = new Set(['Connected','Call back requested','Meeting booked','Replied']);
const CONVO = new Set(['Connected','Call back requested','Meeting booked']);  /* a live phone conversation with the prospect */
const weekStart = D => { const d=parseYmd(D); d.setDate(d.getDate()-((d.getDay()+6)%7)); return ymd(d); };
const KPI_PERIODS = [['week','This week'],['last','Last week'],['30','Last 30 days'],['90','Last 90 days'],['all','All time']];
function kpiRange(p){
  const t=todayStr();
  if (p==='week') return {from:weekStart(t), to:t};
  if (p==='last'){ const s=addDays(weekStart(t),-7); return {from:s, to:addDays(s,6)}; }
  if (p==='30') return {from:addDays(t,-29), to:t};
  if (p==='90') return {from:addDays(t,-89), to:t};
  return {from:'0000-01-01', to:t};
}
function bizDaysIn(list, from, to){
  let a=from; if (a<'2000'){ a=to; for (const c of list) for (const t of allTouches(c)) if (t.date && t.date<a) a=t.date; }
  const b = to<todayStr() ? to : todayStr(); let n=0;
  for (let d=a; d<=b; d=addDays(d,1)){ const w=parseYmd(d).getDay(); if (w && w<6) n++; }
  return Math.max(1,n);
}
function weekdaysBetween(a, b){ let n=0; for (let d=a; d<=b; d=addDays(d,1)){ const w=parseYmd(d).getDay(); if (w && w<6) n++; } return n; }

  for (const c of list){
    if (c.startDate && c.startDate>=from && c.startDate<=to && c.status!=='New') k.started++;
    const md=meetingDate(c); if (md && md>=from && md<=to){ k.meetings++; const o=optimal(company(c)); if (o===3) k.meetOpt3++; if (o>=2) k.meetOpt2++; }
    let any=false, resp=false;
    for (const t of allTouches(c)){ if (!t.date || t.date<from || t.date>to || t.outcome==='Skip') continue; any=true;
      if (t.ch==='call'){ k.dials++; if (LIVE.has(t.outcome)) k.live++; if (CONVO.has(t.outcome)) k.convo++; if (t.outcome==='Left voicemail') k.vm++; if (/^Gatekeeper/.test(t.outcome)) k.gk++; }
      else if (t.ch==='email'){ if (!String(t.step).startsWith('reply-')) k.emails++; if (t.outcome==='Replied'||t.outcome==='Meeting booked') k.replies++; if (t.outcome==='Opted out') k.optout++; }
      else { k.li++; if (t.outcome==='Accepted') k.liAcc++; if (t.outcome==='Replied') k.liRep++; if (t.outcome==='Followed') k.liFol++; if (t.outcome==='Follow requested') k.liReq++; }

const pct = (a,b) => b ? `${(100*a/b).toFixed(a/b<0.1?1:0)}%` : '–';
const firstResponse = c => allTouches(c).find(t=>RESPONSE.has(t.outcome));
function kpiSteps(list, from, to){
  const rows=new Map();
  for (const [tk, st] of Object.entries(TRACKS)) for (const s of st) rows.set(`${tk}|${s.id}`, {track:TRACK_LABEL[tk], day:s.day, label:s.label, ch:s.ch, done:0, resp:0, meet:0});
  rows.set('recall', {track:'Call-backs', day:'', label:'Scheduled call-backs', ch:'call', done:0, resp:0, meet:0});
  rows.set('reply', {track:'Other', day:'', label:'Email replies with no send logged', ch:'email', done:0, resp:0, meet:0});
  for (const c of list){
    const tk=c.track||trackFor(c), fr=firstResponse(c), booked=c.status==='Discovery booked';
    for (const t of allTouches(c)){ if (!t.date || t.date<from || t.date>to || t.outcome==='Skip') continue;
      const key = String(t.step).startsWith('recall-') ? 'recall' : String(t.step).startsWith('reply-') ? 'reply' : `${t.track||tk}|${t.step}`;
      if (!rows.has(key)) rows.set(key, {track:TRACK_LABEL[tk]||tk, day:'', label:`${t.label} (removed step)`, ch:t.ch, done:0, resp:0, meet:0});

function kpiHours(list, from, to){

  for (const c of list){ const z=zoneInfo(c).zone;
    for (const t of allTouches(c)){ if (t.ch!=='call' || t.outcome==='Skip' || !t.date || t.date<from || t.date>to || String(t.step).startsWith('recall-')) continue;
      if (!z || t.sheet || !t.at){ skipped++; continue; }
      const h=Math.min(17, Math.max(7, Math.floor(hourIn(ZONES[z].iana, new Date(t.at))))); b[h].dials++; if (LIVE.has(t.outcome)) b[h].live++; } }
  return {rows:Object.entries(b).map(([h,v])=>({h:+h, label:+h===7?'Before 8am':+h===17?'5pm and later':`${fmtHour(+h)}–${fmtHour(+h+1)}`, ...v})), skipped};
}
function spendBand(co){ const a=acctSize(co), s=DB.settings.spend; if (!a.band) return [9,'No estimate'];
  if (a.band==='small') return [0,`Small (under ${money(s.primeMin)})`]; if (a.band==='rfp') return [3,`RFP (over ${money(s.primeMax)})`];
  const mid=Math.round(Math.sqrt(s.primeMin*s.primeMax)/5000)*5000||50000; return a.spend<mid ? [1,`Prime ${money(s.primeMin)}–${money(mid)}`] : [2,`Prime ${money(mid)}–${money(s.primeMax)}`]; }

function kpiModel(){
  const list=DB.contacts.filter(mine), p=UI.kpi.period, {from,to}=kpiRange(p), days=bizDaysIn(list,from,to);
  const sum=kpiCompute(list, from, to);
  const weeks=[]; let ws=weekStart(todayStr()); for (let i=0;i<8;i++){ weeks.unshift({label:prettyDate(ws), ...kpiCompute(list, ws, addDays(ws,6))}); ws=addDays(ws,-7); }

  const status={}; for (const c of list) status[c.status]=(status[c.status]||0)+1;

  const t=todayStr(), mStart=t.slice(0,8)+'01', mEnd=(()=>{ const d=parseYmd(mStart); d.setMonth(d.getMonth()+1); d.setDate(0); return ymd(d); })();

    ['Business days',m.days],['Dials',k.dials],['Dials per day',+(k.dials/m.days).toFixed(1)],['Daily dial target',DB.settings.caps.dials],['Live answers',k.live],['Live-answer rate',r(k.live,k.dials)],
    ['Voicemails',k.vm],['Gatekeepers',k.gk],['Conversations',k.convo],['Meetings booked',k.meetings],['Emails sent',k.emails],['Email replies',k.replies],['Reply rate',r(k.replies,k.emails)],
    ['Bounces',k.bounces],['Bounce rate',r(k.bounces,k.emails)],['Opt-outs',k.optout],['LinkedIn touches',k.li],['LinkedIn accepted',k.liAcc],['LinkedIn replies',k.liRep],['LinkedIn followed',k.liFol],['LinkedIn follow requests',k.liReq],
    ['New contacts started',k.started],['Contacts worked',k.touched],['Contacts reached',k.reached],[],
    ['Playbook scorecard',''],['Calls → conversations',r(k.convo,k.dials)],['Conversations → discovery booked',r(k.meetings,k.convo)],['Discovery calls at Optimal-3 accounts',r(k.meetOpt3,k.meetings)],['Discovery calls at Optimal 2+',r(k.meetOpt2,k.meetings)],
    ['Discovery booked this month',m.pace.mtd],['Monthly discovery goal',m.pace.goal],['On pace by today',+m.pace.expected.toFixed(1)],['Dials per discovery (last 90 days)',m.pace.dialsPer!=null?+m.pace.dialsPer.toFixed(1):''],['Dials a day the goal needs (per rep)',m.pace.need!=null?Math.ceil(m.pace.need):'']], 'Summary', [36,14]);
  if (m.byRep) add([['Rep','Dials','Dials per day','Live rate','Conversations','Emails','Reply rate','Started','Meetings'], ...m.byRep.map(x=>[x.label,x.dials,+(x.dials/x.days).toFixed(1),r(x.live,x.dials),x.convo,x.emails,r(x.replies,x.emails),x.started,x.meetings])], 'By rep', [14,8,12,10,14,8,10,8,9]);
  add([['Week of','Dials','Live','Live rate','Conversations','Emails','Replies','Started','Meetings'], ...m.weeks.map(w=>[w.label,w.dials,w.live,r(w.live,w.dials),w.convo,w.emails,w.replies,w.started,w.meetings])], 'Weekly', [14,8,8,10,14,8,8,8,9]);
  add([['Track','Day','Step','Channel','Done','Responses','Rate','Meetings started here'], ...m.steps.filter(x=>x.done||x.track===TRACK_LABEL.cold).map(x=>[x.track,x.day,x.label,CH_LABEL[x.ch],x.done,x.resp,r(x.resp,x.done),x.meet])], 'By step', [26,6,40,9,7,10,8,20]);
  add([['Prospect local hour','Dials','Live','Live rate'], ...m.hours.rows.map(x=>[x.label,x.dials,x.live,r(x.live,x.dials)])], 'By hour', [18,8,8,10]);
  const g=rows=>[['Group','Contacts worked','Dials','Live rate','Reply rate','Reached rate','Meetings','Meetings per 100 contacts'], ...rows.map(x=>[x.label,x.touched,x.dials,r(x.live,x.dials),r(x.replies,x.emails),r(x.reached,x.touched),x.meetings,x.touched?+(100*x.meetings/x.touched).toFixed(1):''])];
  add(g(m.spend),'By account size',[26,16,8,10,10,12,9,22]); add(g(m.opt),'By Optimal score',[14,16,8,10,10,12,9,22]); add(g(m.lossRsn),'Win-backs by loss reason',[30,16,8,10,10,12,9,22]); add(g(m.source),'By lead source',[16,16,8,10,10,12,9,22]); add(g(m.persona),'By persona',[30,16,8,10,10,12,9,22]);
  XLSX.writeFile(wb, `kpi-${fileTag()}-${m.p}-${todayStr()}.xlsx`);
}

  if (el.id==='bulkOwner' && el.value){ for (const x of DB.contacts) if (UI.selected.has(x.id)){ x.owner=el.value; touch(x); } save(); render(); return; }
  if (el.id==='bulkStatus' && el.value){ for (const x of DB.contacts) if (UI.selected.has(x.id)){ x.status=el.value; if (el.value==='Discovery booked' && !x.discoveryDate) x.discoveryDate=todayStr(); if (el.value==='Nurture') x.revisitDate=addDays(todayStr(),90); touch(x); } save(); render(); return; }
  if (d.rep){ const r=DB.settings.reps.find(x=>x.id===d.rep); if (r){ r[d.rf]=el.value; save(); renderHeader(); } return; }
  if (d.cap){ DB.settings.caps[d.cap]=Math.max(0,+el.value||0); save(); return; }
  if (d.spend){ DB.settings.spend[d.spend]=Math.max(0,+el.value||0); save(); render(); return; }
  if (d.lost){ const c=DB.contacts.find(x=>x.id===UI.drawer); if (c){ const L=c.lost=c.lost||{}; L[d.lost]=el.value;
      if (d.lost==='verbatim'){ const det=detectLoss(el.value); if (det.reasons.length){ L.reasons=det.reasons; L.cat=det.reasons[0]; } if (det.competitor){ L.competitor=det.competitor; if (!company(c).provider) company(c).provider=det.competitor; }
        toast(det.reasons.length||det.competitor ? `Read from their response: ${[det.competitor&&'chose '+det.competitor, det.reasons.filter(r=>r!=='competitor').map(k=>LOSS_CATS[k]).join(', ')].filter(Boolean).join(' · ')}. Check the boxes.` : 'Saved. No reasons recognized; tick them below.'); }
      if (c.status==='Nurture') c.revisitDate=lostFollowUp(c).date;
      touch(c); save(); render(); } return; }
  if (d.lostreason){ const c=DB.contacts.find(x=>x.id===UI.drawer); if (c){ const L=c.lost=c.lost||{}; let rs=lossReasons(L).filter(k=>k!=='other' || el.checked && d.lostreason==='other');
      rs = el.checked ? [...rs.filter(k=>k!==d.lostreason), d.lostreason] : rs.filter(k=>k!==d.lostreason); if (!rs.length) rs=['other']; L.reasons=rs; L.cat=rs[0]; if (c.status==='Nurture') c.revisitDate=lostFollowUp(c).date; touch(c); save(); render(); } return; }
  if (d.wb){ DB.settings.winback[d.wb]= ['whatsNew','industryProof'].includes(d.wb) ? el.value : Math.max(0,+el.value||0); save(); render(); return; }
  if (d.goal){ DB.settings.goals[d.goal]=Math.max(0,+el.value||0); save(); return; }
  if (d.rate){ DB.settings.rates[d.rate]=Math.max(1,+el.value||1); save(); return; }
  if (d.mid){ DB.settings.mid[d.mid]=Math.max(0,+el.value||0); save(); return; }
  if (d.win){ const v=el.value; if (v.trim() && !parseWins(v).length){ toast('Could not read that range. Try 8-11, 16-17'); return; } DB.settings.windows[d.win]=v; buildWindows(); save(); toast('Windows updated'); return; }
  if (d.set){ DB.settings[d.set] = el.type==='checkbox' ? el.checked : el.type==='number' ? Math.max(1,+el.value||1) : el.value; save(); return; }
  const c = UI.drawer && DB.contacts.find(x=>x.id===UI.drawer);
  if (c && d.cf2){ c[d.cf2]=el.checked; touch(c); save(); render(); return; }
  if (c && d.cf){ const prevEmail=c.email; c[d.cf]=el.value; if (d.cf==='email'){ c.email=el.value.trim().toLowerCase(); if (c.email!==prevEmail){ c.emailBad=false; if (emailDomain(c.email)!==emailDomain(prevEmail)) c.emailBlocked=false; } } if (d.cf==='name'){ const p=el.value.trim().split(/\s+/); c.first=p[0]||''; c.last=p.slice(1).join(' '); }
    if (d.cf==='startDate' && !isValidYmd(el.value)) return; if (d.cf==='status' && el.value==='Attempting' && !c.startDate){ startCadence(c); } if (d.cf==='status' && el.value==='Discovery booked' && !c.discoveryDate) c.discoveryDate=todayStr(); touch(c); save(); render(); return; }
  if (c && d.cof){ const co=DB.companies[c.companyKey]; if (!co) return;
    if (d.cof==='midOverride') co.midOverride = el.value==='yes'?true:el.value==='no'?false:null;
    else if (el.type==='checkbox') co[d.cof]=el.checked;
    else if (el.type==='number') co[d.cof]= el.value===''?'':+el.value;
    else co[d.cof]=el.value;
    for (const x of DB.contacts) if (x.companyKey===c.companyKey) touch(x);
    save(); render(); }
});
document.addEventListener('keydown', e=>{ if (e.key!=='Escape') return; if (UI.modal?.type==='setup') return; if (UI.modal){ UI.modal=null; renderModal(); } else if (UI.drawer){ UI.drawer=null; renderDrawer(); } });
setInterval(()=>{ if (UI.tab==='today' && !UI.drawer && !UI.modal && !document.querySelector('details[open]') && !['INPUT','SELECT','TEXTAREA'].includes(document.activeElement?.tagName)) render(); }, 60000);

load().then(()=>{ render(); if (!DB.setupDone){ UI.modal={type:'setup'}; renderModal(); } });
</script>
</body>
